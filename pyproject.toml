[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "advertrappr"
version = "0.0.1"
description = "CLI tool for scraping real estate listings and sending Telegram notifications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Ivan Derkach", email = "dsp_shp@icloud.com"},
]
urls = {homepage = "https://github.com/dsp-shp/advertrappr"}
dependencies = [
    "beautifulsoup4==4.12.3",
    "pandas==2.2.1",
    "python-telegram-bot==21.0.1",
    "selenium==4.19.0",
    "webdriver-manager==4.0.1",
    "duckdb",
    "click==8.1.7",
    "jinja2==3.1.4",
    "lxml",
    "PyYAML",
    "ipython"
]

[project.scripts]
advertrappr = "advertrappr.main:cli"

[tool.setuptools.packages.find]
include = ["advertrappr*"]

[tool.setuptools.package-data]
advertrappr = ["utils/templates/*"]
